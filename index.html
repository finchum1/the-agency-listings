<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Anti-flash: applies the `dark` class before first paint, matching
         src/hooks/useTheme.js's own rule exactly (same storage key,
         same "system" fallback) so the dashboard never flashes light
         before React mounts and re-derives the same answer. Harmless on
         every other host too — the public site templates never use
         `dark:` utilities, so this class has no visible effect there. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("dash-theme") || "system";
          var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <!-- The Agency's own red mark, white-on-brand-red — applies to every
         hostname this app serves (the dashboard, and every agent's/
         listing's own custom domain), since it's all one SPA/index.html. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <!-- Explicit sizes here matters more than it looks: without it, some
         iOS versions have been seen picking the plain sizes="512x512"
         favicon above (favicon-512.png, edge-to-edge — fine as a browser
         tab icon, never meant to be home-screen-masked) over this one for
         "Add to Home Screen", clipping the mark. apple-touch-icon.png is
         180x180 with a real safe-zone margin built in — this pins it as
         the unambiguous, correctly-sized candidate. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Agency — property listing sites and agent dashboard" />
    <!-- PWA install/home-screen metadata for the dashboard host — see
         src/main.jsx's isAppHost() gate on the service worker itself;
         these tags are harmless to leave present on every host, since
         without a registered service worker there's no install prompt. -->
    <meta name="theme-color" content="#ed2127" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="The Agency" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&family=Lato:wght@300;400;700;900&family=Fraunces:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Work+Sans:wght@300;400;500;600;700&family=Libre+Baskerville:wght@400;700&family=Karla:wght@300;400;500;600;700&family=Bodoni+Moda:wght@500;600;700&family=Manrope:wght@300;400;500;600;700&family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>The Agency Listings</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
