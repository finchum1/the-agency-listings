<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Anti-flash: applies the `dark` class before first paint, matching
         src/hooks/useTheme.js's own rule exactly (same storage key,
         same "system" fallback) so the dashboard never flashes light
         before React mounts and re-derives the same answer. Harmless on
         every other host too — the public site templates never use
         `dark:` utilities, so this class has no visible effect there. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("dash-theme") || "system";
          var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <!-- The Agency's own red mark, white-on-brand-red — applies to every
         hostname this app serves (the dashboard, and every agent's/
         listing's own custom domain), since it's all one SPA/index.html. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- Google's search results want a square favicon whose side is a multiple of 48px (48, 96, 144, 192); without one it shows a grey globe. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <!-- Explicit sizes here matters more than it looks: without it, some
         iOS versions have been seen picking the plain sizes="512x512"
         favicon above (favicon-512.png, edge-to-edge — fine as a browser
         tab icon, never meant to be home-screen-masked) over this one for
         "Add to Home Screen", clipping the mark. apple-touch-icon.png is
         180x180 with a real safe-zone margin built in — this pins it as
         the unambiguous, correctly-sized candidate. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Installed home-screen app only: extend the page under the status
         bar and push content down by the safe-area height. Browsers and
         every public site are left untouched. -->
    <script>
      (function () {
        try {
          var standalone =
            window.navigator.standalone === true ||
            (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
          if (!standalone) return;
          var vp = document.querySelector('meta[name="viewport"]');
          if (vp) vp.setAttribute("content", vp.getAttribute("content") + ", viewport-fit=cover");
          document.documentElement.style.paddingTop = "env(safe-area-inset-top)";
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="The Agency Dashboard: your website, listings, leads, pipeline and calendar in one place." />
    <!-- PWA install/home-screen metadata for the dashboard host — see
         src/main.jsx's isAppHost() gate on the service worker itself;
         these tags are harmless to leave present on every host, since
         without a registered service worker there's no install prompt. -->
    <meta name="theme-color" content="#ed2127" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent: the page draws under the status bar (clock/battery
         stay white), instead of iOS painting its own light, frosted band
         above a dark dashboard. iOS stores this when the app is added to
         the home screen. The strip behind the status bar is drawn by
         StandaloneStatusBar.jsx. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Latchpoint" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&family=Lato:wght@300;400;700;900&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Latchpoint</title>
    <!-- Tab title before the app loads: every site's real title is only known once its data arrives, so until then the tab said "Latchpoint" on
         agents' own sites. lib/pageMeta.js remembers each page's title in this browser; this puts it back before first paint on the next visit. -->
    <script>
      (function () {
        try {
          // A gift drop-off link is opened by someone who has never visited, so there is nothing remembered yet: name it from the address.
          if (/^\/dropoff\//.test(location.pathname)) document.title = "Drop Off List";
          var t = localStorage.getItem("pageTitle:" + location.host + location.pathname);
          if (t) document.title = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
